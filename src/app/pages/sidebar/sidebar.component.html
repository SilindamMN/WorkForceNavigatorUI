<div class="app-sidebar">

  <div class="ui vertical borderless fluid text menu">

    <!-- DASHBOARD -->
    <button type="button"
            class="item"
            [class.active]="activeLink === 'Dashboard'"
            (click)="setActive('Dashboard')">
      <i class="home icon"></i>
      Dashboard
    </button>

    <div class="divider"></div>

    <!-- ================= HR ================= -->
    <div class="group">

      <button type="button"
              class="group-title"
              [class.open]="toggleHR"
              [attr.aria-expanded]="toggleHR"
              (click)="toggleHR = !toggleHR">
        <div class="left">
          <i class="users icon"></i>
          <span>HR</span>
        </div>
        <i class="dropdown icon"></i>
      </button>

      <div class="submenu-wrapper" [class.open]="toggleHR">
        <div class="submenu">
          
         <button type="button" class="item" [class.active]="activeLink === 'Departments'" routerLink="/hr/departments" (click)="setActive('Departments')"><i class="sitemap icon"></i> Departments</button>

<button type="button" class="item" [class.active]="activeLink === 'Managers'" routerLink="/hr/managers" (click)="setActive('Managers')"><i class="user tie icon"></i> Managers</button>

<button type="button" class="item" [class.active]="activeLink === 'Job Titles'" routerLink="/hr/jobtitles" (click)="setActive('Job Titles')"><i class="tag icon"></i> Job Titles</button>

<button type="button" class="item" [class.active]="activeLink === 'Teams'" routerLink="/hr/teams" (click)="setActive('Teams')"><i class="users icon"></i> Teams</button>

<button type="button" class="item" [class.active]="activeLink === 'Users'" routerLink="/hr/users" (click)="setActive('Users')"><i class="user icon"></i> Users</button>

<button type="button" class="item" [class.active]="activeLink === 'Clients'" routerLink="/hr/clients" (click)="setActive('Clients')"><i class="user tie icon"></i> Clients</button> </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ================= WORK ================= -->
    <div class="group">

      <button type="button"
              class="group-title"
              [class.open]="toggleWork"
              [attr.aria-expanded]="toggleWork"
              (click)="toggleWork = !toggleWork">
        <div class="left">
          <i class="folder open icon"></i>
          <span>Work</span>
        </div>
        <i class="dropdown icon"></i>
      </button>

      <div class="submenu-wrapper" [class.open]="toggleWork">
        <div class="submenu">
          
          <button type="button" class="item" [class.active]="activeLink === 'Projects'"  routerLink="/work/projects" (click)="setActive('Projects')"><i class="briefcase icon"></i> Projects</button>
          <button type="button" class="item" [class.active]="activeLink === 'Tasks'" routerLink="/work/tasks" (click)="setActive('Tasks')"><i class="tasks icon"></i> Tasks</button>
          <button type="button" class="item" [class.active]="activeLink === 'Timesheets'" routerLink="/work/timesheets" (click)="setActive('Timesheets')"><i class="clock icon"></i> Timesheets</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ================= LEAVES ================= -->
    <div class="group">

      <button type="button"
              class="group-title"
              [class.open]="toggleLeaves"
              [attr.aria-expanded]="toggleLeaves"
              (click)="toggleLeaves = !toggleLeaves">
        <div class="left">
          <i class="calendar alternate icon"></i>
          <span>Leaves</span>
        </div>
        <i class="dropdown icon"></i>
      </button>

      <div class="submenu-wrapper" [class.open]="toggleLeaves">
        <div class="submenu">
                      <button type="button" class="item" [class.active]="activeLink === 'leave-Allocations'"  routerLink="/leaves/leave-allocations" (click)="setActive('Leave Allocations')"><i class="calendar check icon"></i>Leave Allocations</button>
          <button type="button" class="item" [class.active]="activeLink === 'leave-requests'" routerLink="/leaves/leave-requests" (click)="setActive('Leave Requests')"><i class="paper plane icon"></i> Leave Requests</button>
  </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ================= SYSTEM ================= -->
    <div class="group">

      <button type="button"
              class="group-title"
              [class.open]="toggleSystem"
              [attr.aria-expanded]="toggleSystem"
              (click)="toggleSystem = !toggleSystem">
        <div class="left">
          <i class="cogs icon"></i>
          <span>System</span>
        </div>
        <i class="dropdown icon"></i>
      </button>

      <div class="submenu-wrapper" [class.open]="toggleSystem">
        <div class="submenu">
          <button type="button" class="item" [class.active]="activeLink === 'Messages'" (click)="setActive('Messages')"><i class="envelope icon"></i> Messages</button>
          <button type="button" class="item" [class.active]="activeLink === 'Logs'" (click)="setActive('Logs')"><i class="clipboard list icon"></i> Logs</button>
        </div>
      </div>
    </div>

  </div>

</div>
