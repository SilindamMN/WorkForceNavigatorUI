<div class="jobtitles-wrapper">
  <app-generic-table
    [data]="teams"
    [columns]="teamColumns"
    [showCreate]="true"
    [pageSize]="10"
    (rowClick)="editTeamShowDrawer($event)"
    (create)="createTeam()">
  </app-generic-table>
</div>

<app-drawer-form
  [isOpen]="showDrawer"
  [mode]="mode"
  [title]="'Team'"
  [fields]="teamFields"
  [model]="selectedTeam"
  (saved)="saveTeam($event)"
  (deleted)="deleteTeam($event)"
  (closed)="showDrawer = false">
</app-drawer-form>
