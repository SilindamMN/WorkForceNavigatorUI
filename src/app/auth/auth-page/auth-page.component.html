<div class="auth-container">

  <div class="auth-card">

    <!-- LOGIN -->
    <div *ngIf="isLogin" class="p-4">

      <h4 class="text-center mb-4">Welcome Back</h4>

      <input type="email" class="form-control mb-3" placeholder="Email address" />

      <input type="password" class="form-control mb-3" placeholder="Password" />

      <button class="btn btn-primary w-100 mb-3">
        Sign in
      </button>

      <p class="text-center small">
        Don’t have an account?
        <a href="#" (click)="switchToRegister(); $event.preventDefault()">
          Register
        </a>
      </p>

    </div>

    <!-- REGISTER -->
    <div *ngIf="!isLogin" class="p-4">

      <h4 class="text-center mb-4">Create Account</h4>

      <input type="text" class="form-control mb-3" placeholder="Username" />

      <input type="text" class="form-control mb-3" placeholder="First Name" />

      <input type="text" class="form-control mb-3" placeholder="Last Name" />

      <input type="email" class="form-control mb-3" placeholder="Email address" />

      <input type="password" class="form-control mb-3" placeholder="Password" />

      <input type="password" class="form-control mb-3" placeholder="Confirm password" />

      <button class="btn btn-success w-100 mb-3">
        Create account
      </button>

      <p class="text-center small">
        Already have an account?
        <a href="#" (click)="switchToLogin(); $event.preventDefault()">
          Login
        </a>
      </p>

    </div>

  </div>

</div>
